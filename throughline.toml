[project]
name = "Rent-statement help page (content-compose example)"
format_version = 3

# A worked example of a *composed* content project. This is an ordinary throughline
# project — its own intent, user requirements and system requirements live under
# intents/, user-requirements/ and system-requirements/ — that additionally adopts
# SIX orthogonal content standards by reference and cites their clauses on the
# system requirements they satisfy:
#   - Plain-language (readability)        namespace `plain`
#   - British-English conventions         namespace `conventions`
#   - Tone — formal register              namespace `tone`
#   - Purpose — instruct                  namespace `purpose`
#   - Audience — general reader           namespace `audience`
#   - Medium — web page                   namespace `medium`
#
# This is the orthogonality payoff: one page has to be readable AND correctly styled
# AND in the right register AND doing the right communicative job AND pitched at the
# right reader AND shaped for the channel it is delivered on, and those are independent
# axes. The project takes exactly the six axes it needs and cites `plain:SR-NNNN`,
# `conventions:SR-NNNN`, `tone:SR-NNNN`, `purpose:SR-NNNN`, `audience:SR-NNNN` and
# `medium:SR-NNNN` side by side. The six sources never collide even though each numbers
# its items SR-0001 upward, because each is imported under its own namespace.
#
# Note the deliberate tension between two of these axes: `plain` is UNIVERSAL clarity
# for any reader, while `audience` tunes how much prior knowledge and field vocabulary
# the writing may assume for a SPECIFIC reader. They are independent and both compose.
#
# Four of these axes are families of mutually-exclusive sibling sources: register
# (throughline-tone-formal / -neutral / -informal), purpose
# (throughline-purpose-inform / -instruct / -persuade), audience
# (throughline-audience-expert / -practitioner / -general) and medium
# (throughline-medium-web / -letter). A government rent-statement help page composes the
# FORMAL register, the INSTRUCT purpose, the GENERAL-reader audience and the WEB-page
# medium — its job is to help a lay tenant read the statement and pay online. The
# sibling project content-compose-letter-example keeps all of that and swaps only the
# medium for the LETTER sibling, showing how one axis changes without touching the rest.
#
# Drive this project with `tl-compose`, never bare `tl`: the composition-aware
# `check` merges the sources into one union graph and validates it. Bare `tl` fails
# fast the moment it meets a namespace-qualified reference it cannot resolve.
#
# Each source is adopted BY REFERENCE — a git `url` pinned to an edition `ref` —
# never vendored or copied. tl-compose fetches the pinned ref into a per-user cache
# outside this project, so this project's own item scan never sees the borrowed
# graphs. Moving to a newer edition of a source is a one-line `ref` change here.
[[sources]]
namespace = "plain"
url = "https://github.com/rhodium-org/throughline-plain-language"
ref = "v2026-07"

[[sources]]
namespace = "conventions"
url = "https://github.com/rhodium-org/throughline-conventions-uk"
ref = "v2026-07"

[[sources]]
namespace = "tone"
url = "https://github.com/rhodium-org/throughline-tone-formal"
ref = "v2026-07"

[[sources]]
namespace = "purpose"
url = "https://github.com/rhodium-org/throughline-purpose-instruct"
ref = "v2026-07"

[[sources]]
namespace = "audience"
url = "https://github.com/rhodium-org/throughline-audience-general"
ref = "v2026-07"

[[sources]]
namespace = "medium"
url = "https://github.com/rhodium-org/throughline-medium-web"
ref = "v2026-07"

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

# The union is governed by THIS schema, so the consumer must declare types, links and
# statuses that are a superset of what every source uses internally. All five sources
# mark source_ref required and carry a `principle` grouping attr on their rules; here
# those are optional, which still accepts the sources' items while not forcing this
# project's own items to carry them.
[types.user_requirement]
attrs.source_ref = { required = false }

[types.system_requirement]
attrs.source_ref = { required = false }
attrs.principle  = { required = false }

[links]
types = ["derives_from", "implements", "satisfies", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }
# The borrowed-clause link: a page requirement satisfies a plain-language,
# conventions, tone, purpose or audience rule. `satisfies` is a traceability link, not a
# grounding link, so a page SR still grounds through `implements`, not the standard.
satisfies    = { from = ["system_requirement"], to = ["system_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'proposed' no route to it, so an item resting in 'proposed' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# proposed suspect`.
proposed    = ["draft", "approved", "ratified", "deferred", "rejected", "deleted",
               "suspect"]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'draft' no route to it, so an item resting in 'draft' could never be marked
# suspect and invalidating anything it grounds in would have left it unflagged.
# Narrow it back deliberately with `tl schema transition deny draft suspect`.
draft       = ["approved", "deferred", "rejected", "deleted", "suspect"]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'deferred' no route to it, so an item resting in 'deferred' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# deferred suspect`.
deferred    = ["draft", "approved", "rejected", "deleted", "suspect"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

# Semantic status roles (SR-0131): which declared status
# plays each role the tool's operations act on. Backfilled by
# `tl migrate`; edit to match your own status vocabulary.
[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
