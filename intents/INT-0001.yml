uid: INT-0001
type: intent
status: approved
title: A tenant can read and act on the rent-statement help page
text: 'The council publishes a help page explaining how to read a rent statement.
  A tenant must be able to understand it on first reading and the page must follow
  the council''s British-English house style. Being readable and being correctly
  styled are independent goals, so the page adopts both a readability standard and a
  mechanics standard.'
normative: false
